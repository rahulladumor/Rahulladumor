<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="title desc">
  <title id="title">Rahul Ladumor production architecture operating model</title>
  <desc id="desc">A visual showing production problems flowing through architecture controls to measurable outcomes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081321"/>
      <stop offset=".52" stop-color="#0d1727"/>
      <stop offset="1" stop-color="#0a101c"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31c7f5"/>
      <stop offset=".5" stop-color="#6d7cff"/>
      <stop offset="1" stop-color="#a56cff"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#8295bf" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000711" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#7180ff"/>
    </marker>
  </defs>

  <rect width="1200" height="430" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="428" rx="21" fill="none" stroke="#8095c9" stroke-opacity=".16"/>

  <text x="48" y="48" font-family="'Segoe UI',Arial,sans-serif" font-size="21" font-weight="700" fill="#eef3ff">How I move systems from risk to reliable production</text>
  <text x="48" y="73" font-family="'JetBrains Mono',monospace" font-size="12" fill="#7f91ac">PROBLEM SIGNAL → ARCHITECTURE CONTROL → MEASURABLE OUTCOME</text>

  <text x="48" y="115" font-family="'JetBrains Mono',monospace" font-size="11" fill="#5fbfe2" letter-spacing="1.1">01 / FAILURE SIGNALS</text>
  <text x="430" y="115" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8490ff" letter-spacing="1.1">02 / CONTROL PLANE</text>
  <text x="868" y="115" font-family="'JetBrains Mono',monospace" font-size="11" fill="#b28aff" letter-spacing="1.1">03 / BUSINESS RESULT</text>

  <g filter="url(#shadow)">
    <rect x="48" y="136" width="286" height="68" rx="14" fill="#0d2131" stroke="#31c7f5" stroke-opacity=".34"/>
    <circle cx="75" cy="170" r="10" fill="#31c7f5" fill-opacity=".15" stroke="#31c7f5"/>
    <path d="M70 170h10M75 165v10" stroke="#8ce4ff" stroke-width="1.6"/>
    <text x="98" y="164" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#86a0b4">AI RELIABILITY</text>
    <text x="98" y="184" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#e1f8ff">Wrong evidence · failed tools</text>

    <rect x="48" y="220" width="286" height="68" rx="14" fill="#102033" stroke="#5f8cff" stroke-opacity=".34"/>
    <circle cx="75" cy="254" r="10" fill="#5f8cff" fill-opacity=".15" stroke="#5f8cff"/>
    <path d="M70 254h10M75 249v10" stroke="#a8b9ff" stroke-width="1.6"/>
    <text x="98" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#899ab7">PLATFORM RISK</text>
    <text x="98" y="268" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#e4e8ff">Fragility · security · incidents</text>

    <rect x="48" y="304" width="286" height="68" rx="14" fill="#171d32" stroke="#9e73ff" stroke-opacity=".34"/>
    <circle cx="75" cy="338" r="10" fill="#9e73ff" fill-opacity=".15" stroke="#9e73ff"/>
    <path d="M70 338h10M75 333v10" stroke="#dec9ff" stroke-width="1.6"/>
    <text x="98" y="332" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#9d91b5">COST PRESSURE</text>
    <text x="98" y="352" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#f1e7ff">Waste · token spend · no owner</text>
  </g>

  <path d="M350 170H402M350 254H402M350 338H402" stroke="url(#flow)" stroke-width="2" marker-end="url(#arrow)" opacity=".75"/>

  <g filter="url(#shadow)">
    <rect x="416" y="136" width="378" height="236" rx="18" fill="#101a2d" stroke="#7281ff" stroke-opacity=".43"/>
    <rect x="438" y="158" width="334" height="42" rx="10" fill="#12233a"/>
    <text x="456" y="184" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#dfe7ff">Evidence and architecture review</text>

    <rect x="438" y="211" width="160" height="55" rx="10" fill="#102437" stroke="#31c7f5" stroke-opacity=".25"/>
    <text x="454" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#78a2b6">AI CONTROLS</text>
    <text x="454" y="252" font-family="'JetBrains Mono',monospace" font-size="11" fill="#ccf3ff">Evals · guardrails</text>

    <rect x="612" y="211" width="160" height="55" rx="10" fill="#151f38" stroke="#7f78ff" stroke-opacity=".28"/>
    <text x="628" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#9299bc">CLOUD CONTROLS</text>
    <text x="628" y="252" font-family="'JetBrains Mono',monospace" font-size="11" fill="#e1e2ff">IAM · SLOs · IaC</text>

    <rect x="438" y="278" width="160" height="55" rx="10" fill="#122234" stroke="#50b9e4" stroke-opacity=".25"/>
    <text x="454" y="301" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#7d9dab">DELIVERY</text>
    <text x="454" y="319" font-family="'JetBrains Mono',monospace" font-size="11" fill="#d2f1ff">Canary · rollback</text>

    <rect x="612" y="278" width="160" height="55" rx="10" fill="#1a1e35" stroke="#a56cff" stroke-opacity=".28"/>
    <text x="628" y="301" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#a095b8">COST CONTROL</text>
    <text x="628" y="319" font-family="'JetBrains Mono',monospace" font-size="11" fill="#efddff">Budgets · evidence</text>

    <text x="605" y="355" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#72849e">OWNER · RUNBOOK · OBSERVABILITY · HANDOVER</text>
  </g>

  <path d="M812 254H842" stroke="url(#flow)" stroke-width="2.4" marker-end="url(#arrow)" opacity=".85"/>

  <g filter="url(#shadow)">
    <rect x="856" y="136" width="296" height="236" rx="18" fill="#12192c" stroke="#a56cff" stroke-opacity=".35"/>
    <circle cx="888" cy="173" r="13" fill="#2ea043" fill-opacity=".16" stroke="#43d17a"/>
    <path d="M882 173l4 4 8-9" fill="none" stroke="#76e39f" stroke-width="2"/>
    <text x="914" y="169" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#8b98ad">OPERABLE</text>
    <text x="914" y="188" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#e6ecf8">Known failure behaviour</text>

    <line x1="880" y1="212" x2="1128" y2="212" stroke="#7b89a6" stroke-opacity=".15"/>

    <circle cx="888" cy="247" r="13" fill="#2ea043" fill-opacity=".16" stroke="#43d17a"/>
    <path d="M882 247l4 4 8-9" fill="none" stroke="#76e39f" stroke-width="2"/>
    <text x="914" y="243" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#8b98ad">MEASURABLE</text>
    <text x="914" y="262" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#e6ecf8">SLOs, quality and spend</text>

    <line x1="880" y1="286" x2="1128" y2="286" stroke="#7b89a6" stroke-opacity=".15"/>

    <circle cx="888" cy="321" r="13" fill="#2ea043" fill-opacity=".16" stroke="#43d17a"/>
    <path d="M882 321l4 4 8-9" fill="none" stroke="#76e39f" stroke-width="2"/>
    <text x="914" y="317" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#8b98ad">OWNED</text>
    <text x="914" y="336" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#e6ecf8">Clear team and rollback</text>
  </g>

  <text x="48" y="405" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#657892">The objective is not more architecture. It is less production uncertainty.</text>
</svg>