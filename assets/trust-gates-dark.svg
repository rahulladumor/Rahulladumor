<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-labelledby="title desc">
  <title id="title">The demo to production gap</title>
  <desc id="desc">A bridge from a working AI demo to an owned, observable and economically controlled production system.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080e1a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#f4f7fb"/>
    </marker>
  </defs>
  <rect width="1200" height="390" rx="20" fill="url(#paper)"/>
  <rect x="1" y="1" width="1198" height="388" rx="19" fill="none" stroke="#dbe5f2" stroke-opacity=".18"/>

  <text x="44" y="48" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="1.5" fill="#8a6112">THE DEMO-TO-PRODUCTION GAP</text>
  <text x="44" y="82" font-family="'Segoe UI',Arial,sans-serif" font-size="24" font-weight="750" fill="#f4f7fb">The model is rarely the whole problem.</text>
  <text x="44" y="108" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#a7b4c5">Production adds identity, evidence, failure, cost, ownership and rollback.</text>

  <g transform="translate(44 146)">
    <rect width="216" height="166" rx="16" fill="#121c2c" stroke="#2b3a50"/>
    <rect width="216" height="7" rx="3.5" fill="#f2b84b"/>
    <text x="22" y="41" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#8a6112">STATE / DEMO</text>
    <text x="22" y="70" font-family="Georgia,'Times New Roman',serif" font-size="25" font-style="italic" fill="#f4f7fb">"It works."</text>
    <text x="22" y="101" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#a7b4c5">Happy-path prompt</text>
    <text x="22" y="123" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#a7b4c5">Friendly data</text>
    <text x="22" y="145" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#a7b4c5">One operator</text>
  </g>

  <path d="M279 229H329" stroke="#dbe5f2" stroke-width="1.7" marker-end="url(#arrow)"/>

  <g transform="translate(344 135)">
    <rect width="512" height="188" rx="18" fill="#111a2a" stroke="#2b3a50"/>
    <text x="25" y="34" font-family="'JetBrains Mono',monospace" font-size="10.5" letter-spacing="1.3" fill="#9eacbb">PRODUCTION CONTROL SURFACE</text>

    <g transform="translate(24 54)">
      <rect width="140" height="48" rx="10" fill="#172037" stroke="#30a69a" stroke-opacity=".7"/>
      <text x="70" y="21" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#9acdc7">EVIDENCE</text>
      <text x="70" y="37" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#ffffff">evals · traces</text>
    </g>
    <g transform="translate(186 54)">
      <rect width="140" height="48" rx="10" fill="#172037" stroke="#30a69a" stroke-opacity=".7"/>
      <text x="70" y="21" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#9acdc7">BOUNDARIES</text>
      <text x="70" y="37" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#ffffff">IAM · guardrails</text>
    </g>
    <g transform="translate(348 54)">
      <rect width="140" height="48" rx="10" fill="#172037" stroke="#30a69a" stroke-opacity=".7"/>
      <text x="70" y="21" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#9acdc7">ECONOMICS</text>
      <text x="70" y="37" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#ffffff">budgets · limits</text>
    </g>

    <g transform="translate(24 116)">
      <rect width="140" height="48" rx="10" fill="#172037" stroke="#f2b84b" stroke-opacity=".7"/>
      <text x="70" y="21" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#e6c980">DELIVERY</text>
      <text x="70" y="37" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#ffffff">canary · rollback</text>
    </g>
    <g transform="translate(186 116)">
      <rect width="140" height="48" rx="10" fill="#172037" stroke="#f2b84b" stroke-opacity=".7"/>
      <text x="70" y="21" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#e6c980">OPERATIONS</text>
      <text x="70" y="37" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#ffffff">SLOs · runbooks</text>
    </g>
    <g transform="translate(348 116)">
      <rect width="140" height="48" rx="10" fill="#172037" stroke="#f2b84b" stroke-opacity=".7"/>
      <text x="70" y="21" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#e6c980">OWNERSHIP</text>
      <text x="70" y="37" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#ffffff">team · handover</text>
    </g>
  </g>

  <path d="M875 229H925" stroke="#dbe5f2" stroke-width="1.7" marker-end="url(#arrow)"/>

  <g transform="translate(940 146)">
    <rect width="216" height="166" rx="16" fill="#121c2c" stroke="#27665d"/>
    <rect width="216" height="7" rx="3.5" fill="#30a69a"/>
    <text x="22" y="41" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#16796f">STATE / PRODUCTION</text>
    <text x="22" y="70" font-family="Georgia,'Times New Roman',serif" font-size="25" font-style="italic" fill="#f4f7fb">"We trust it."</text>
    <text x="22" y="101" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#a7b4c5">Known failure modes</text>
    <text x="22" y="123" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#a7b4c5">Measured quality and cost</text>
    <text x="22" y="145" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#a7b4c5">Clear owner and rollback</text>
  </g>

  <text x="600" y="357" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#a7b4c5">The objective is not more architecture. It is less production uncertainty.</text>
</svg>